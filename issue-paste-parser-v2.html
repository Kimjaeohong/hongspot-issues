<!--
  종목 이슈 파서 v2 — 수동 입력용 도구 (프로토타입)
  ─────────────────────────────────────────────────────────
  모드 2가지:
   [새로 만들기] 표를 붙여넣어 data/<코드>.json 을 처음부터 생성
   [이어붙이기]  기존 JSON + 새 이슈를 합쳐 중복제거·정렬한 완성본 생성

  파싱 원리: 텍스트에서 날짜(YYYY.MM.DD)를 앵커로 삼아 이슈 단위를 나눔.
  등락률(%)은 각 줄 끝에 있으면 자동 인식하고, 수동으로도 넣을 수 있음.
  ("일자", "내용" 같은 머리글은 날짜 앞이라 자동 무시)
-->
<div id="pp-root">
  <div class="pp-modes">
    <button class="pp-mode is-active" data-mode="new" type="button">새로 만들기</button>
    <button class="pp-mode" data-mode="append" type="button">이어붙이기</button>
  </div>

  <div class="pp-fields">
    <input id="pp-name" class="pp-inp" type="text" placeholder="종목명 (예: 일동제약)" autocomplete="off">
    <input id="pp-code" class="pp-inp" type="text" placeholder="종목코드 (예: 249420)" autocomplete="off">
    <button id="pp-run" class="pp-btn" type="button">파싱하기</button>
  </div>

  <div class="pp-grid">
    <div class="pp-col" id="pp-existing-col" style="display:none">
      <label class="pp-lab">기존 JSON <span class="pp-hint">(지금 레포에 있는 &lt;코드&gt;.json 통째로 붙여넣기)</span></label>
      <textarea id="pp-existing" class="pp-area" placeholder='{ "name": "일동제약", "issues": [ ... ] }'></textarea>
    </div>
    <div class="pp-col">
      <label class="pp-lab">새 이슈 붙여넣기 <span class="pp-hint">(날짜+내용, 끝에 % 있으면 자동 인식)</span></label>
      <textarea id="pp-src" class="pp-area" placeholder="2026.09.04    호실적 기대감에 급등 +12.4%&#10;2026.09.03    외국인 순매수 소식에 상승 3.1%"></textarea>
    </div>
  </div>

  <div class="pp-grid">
    <div class="pp-col">
      <label class="pp-lab">결과 JSON <button id="pp-copy" class="pp-copy" type="button">복사</button></label>
      <textarea id="pp-out" class="pp-area" readonly placeholder="파싱하면 완성본이 여기 나옵니다."></textarea>
    </div>
    <div class="pp-col">
      <label class="pp-lab">미리보기</label>
      <div id="pp-prev" class="pp-prev-box"></div>
    </div>
  </div>
  <div id="pp-stat" class="pp-stat"></div>
</div>

<style>
  #pp-root{
    --bg:#ffffff; --panel:#f7f9fc; --line:#e2e8f0; --line2:#cbd5e1;
    --text:#334155; --dim:#64748b; --hover:#eef2f8;
    --up:#e02424; --down:#1a56db; --navy:#0b2545; --focus:#1a56db; --ok:#0e9f6e;
    --font:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--text); font-family:var(--font);
    max-width:960px; margin:0 auto; padding:20px; border:1px solid var(--line);
    border-radius:10px; box-sizing:border-box;
    box-shadow:0 1px 3px rgba(11,37,69,.06), 0 1px 2px rgba(11,37,69,.04);
  }
  #pp-root *{box-sizing:border-box;}
  .pp-modes{display:flex; gap:6px; margin-bottom:14px; background:var(--panel); padding:5px; border-radius:9px; width:fit-content;}
  .pp-mode{padding:8px 18px; font-size:14px; font-weight:600; font-family:var(--font); color:var(--dim); background:none; border:0; border-radius:6px; cursor:pointer;}
  .pp-mode.is-active{background:#fff; color:var(--navy); box-shadow:0 1px 2px rgba(11,37,69,.12);}
  .pp-fields{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .pp-inp{
    padding:11px 14px; font-size:15px; font-family:var(--font); color:var(--text);
    background:var(--panel); border:1px solid var(--line2); border-radius:8px; outline:none;
  }
  #pp-name{flex:2; min-width:160px;} #pp-code{flex:1; min-width:120px;}
  .pp-inp:focus{border-color:var(--focus);}
  .pp-btn{
    padding:11px 22px; font-size:15px; font-weight:700; font-family:var(--font);
    color:#fff; background:var(--focus); border:none; border-radius:8px; cursor:pointer;
  }
  .pp-btn:hover{filter:brightness(1.05);}
  .pp-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;}
  .pp-col{display:flex; flex-direction:column; min-width:0;}
  .pp-lab{font-size:12px; color:var(--dim); margin-bottom:6px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .pp-hint{color:var(--dim); font-weight:400; font-size:11px;}
  .pp-copy{
    font-size:11px; color:var(--focus); background:none; border:1px solid var(--line2);
    border-radius:5px; padding:1px 8px; cursor:pointer;
  }
  .pp-copy:hover{background:var(--hover);}
  .pp-area{
    width:100%; height:180px; padding:12px 14px; font-size:13px; line-height:1.5;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; color:var(--text);
    background:var(--panel); border:1px solid var(--line2); border-radius:8px;
    outline:none; resize:vertical;
  }
  .pp-area:focus{border-color:var(--focus);}
  .pp-prev-box{
    height:180px; overflow-y:auto; padding:4px 12px; background:var(--panel);
    border:1px solid var(--line2); border-radius:8px;
  }
  .pp-stat{font-size:13px; color:var(--dim); min-height:18px;}
  .pp-stat b{color:var(--text);} .pp-stat .dup{color:var(--up);} .pp-stat .ok{color:var(--ok);}
  .pp-row{display:grid; grid-template-columns:82px 1fr auto; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line);}
  .pp-row .date{color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums;}
  .pp-row .txt{font-size:13px; line-height:1.5;}
  .pp-row .txt.up{color:var(--up);} .pp-row .txt.down{color:var(--down);}
  .pp-row .pct{font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .pp-row .pct.up{color:var(--up);} .pp-row .pct.down{color:var(--down);}
</style>

<script>
(function(){
  const UP = /(급등|상승|강세|상한가|신고가|흑자|호조|호실적|기대감|부각|순항|입증|성공)/;
  const DOWN = /(급락|하락|약세|하한가|불발|보류|취하|우려|실망|부진|적자|지연|감소)/;
  function tone(t){ if(UP.test(t)) return "up"; if(DOWN.test(t)) return "down"; return ""; }

  const $ = id => document.getElementById(id);
  let mode = "new";

  document.querySelectorAll(".pp-mode").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".pp-mode").forEach(b=>b.classList.remove("is-active"));
      btn.classList.add("is-active");
      mode = btn.dataset.mode;
      $("pp-existing-col").style.display = (mode==="append") ? "flex" : "none";
      $("pp-run").textContent = (mode==="append") ? "합치기" : "파싱하기";
    });
  });

  // 날짜 앵커 기반 파싱 + 등락률(%) 추출
  function parse(raw){
    const re = /(\d{4})\.(\d{1,2})\.(\d{1,2})/g;
    const marks = [...raw.matchAll(re)];
    const items = [];
    for(let i=0;i<marks.length;i++){
      const m = marks[i];
      const y=m[1], mo=String(m[2]).padStart(2,"0"), d=String(m[3]).padStart(2,"0");
      const date = `${y}.${mo}.${d}`;
      const start = m.index + m[0].length;
      const end = (i+1<marks.length) ? marks[i+1].index : raw.length;
      let text = raw.slice(start, end).replace(/\s+/g," ").trim();
      text = text.replace(/^[\t\-–—:·|]+\s*/,"").trim();

      // 등락률(%) 추출: +12.4% / -3.1% / 5% 형태
      let pct = null;
      const pm = text.match(/([+\-]?\d+(?:\.\d+)?)\s*%/);
      if(pm){
        pct = parseFloat(pm[1]);
        if(!/[+\-]/.test(pm[1]) && DOWN.test(text)) pct = -Math.abs(pct);
        text = text.replace(pm[0], "").replace(/\s{2,}/g," ").trim();
        text = text.replace(/[,\s]+$/,"").trim();
      }
      const item = { date, text, src:"manual" };
      if(pct !== null && !isNaN(pct)) item.pct = pct;
      if(text) items.push(item);
    }
    return items;
  }

  function keyOf(it){ return it.date + "|" + it.text; }

  function dedupeSort(items){
    const seen = new Map();
    for(const it of items){
      const k = keyOf(it);
      if(!seen.has(k)){ seen.set(k, Object.assign({}, it)); }
      else {
        const prev = seen.get(k);
        if(prev.pct === undefined && it.pct !== undefined) prev.pct = it.pct;
      }
    }
    const out = [...seen.values()];
    out.sort((a,b)=> a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
    return out;
  }

  function run(){
    const name = $("pp-name").value.trim();
    const code = $("pp-code").value.trim();
    const parsed = parse($("pp-src").value);

    let base = [], baseName = "";
    if(mode === "append"){
      const raw = $("pp-existing").value.trim();
      if(raw){
        try{
          const obj = JSON.parse(raw);
          base = Array.isArray(obj.issues) ? obj.issues : [];
          baseName = obj.name || "";
        }catch(e){
          $("pp-stat").innerHTML = `기존 JSON을 읽지 못했습니다. 올바른 JSON인지 확인해 주세요. (${e.message})`;
          return;
        }
      }
    }

    const merged = dedupeSort([...base, ...parsed]);
    const finalName = name || baseName || "(종목명 미입력)";
    const obj = { name: finalName, issues: merged };
    $("pp-out").value = JSON.stringify(obj, null, 2);

    if(mode === "append"){
      const added = merged.length - base.length;
      $("pp-stat").innerHTML = merged.length
        ? `기존 <b>${base.length}</b>건 + 새 입력 <b>${parsed.length}</b>건 → 합쳐서 <span class="ok">${merged.length}</span>건 (신규 약 ${added>0?added:0}건, 중복 자동 제외)`
        : `합칠 이슈가 없습니다.`;
    } else {
      const dup = parsed.length - merged.length;
      $("pp-stat").innerHTML = merged.length
        ? `인식 <b>${parsed.length}</b>건 · 중복 제거 <span class="dup">${dup>0?dup:0}</span>건 · 최종 <b>${merged.length}</b>건`
        : `인식된 이슈가 없습니다. 날짜가 <b>YYYY.MM.DD</b> 형식인지 확인해 주세요.`;
    }

    if(merged.length){
      const rows = merged.slice(0,40).map(it=>{
        const pctHtml = (it.pct!==undefined)
          ? `<span class="pct ${it.pct>=0?'up':'down'}">${it.pct>0?'+':''}${it.pct}%</span>` : `<span></span>`;
        return `<div class="pp-row"><span class="date">${it.date}</span>
          <span class="txt ${tone(it.text)}">${it.text}</span>${pctHtml}</div>`;
      }).join("");
      $("pp-prev").innerHTML = rows + (merged.length>40 ? `<div class="pp-row"><span></span><span class="txt" style="color:var(--dim)">…외 ${merged.length-40}건</span><span></span></div>` : "");
    } else { $("pp-prev").innerHTML=""; }
  }

  $("pp-run").addEventListener("click", run);
  $("pp-copy").addEventListener("click", ()=>{
    const t = $("pp-out"); if(!t.value) return;
    t.select(); try{ document.execCommand("copy"); }catch(e){}
    const btn=$("pp-copy"), o=btn.textContent; btn.textContent="복사됨"; setTimeout(()=>btn.textContent=o,1200);
  });
})();
</script>
