name: 특징주 자동 수집

on:
  schedule:
    # 하루 1회, 장 마감 후. UTC 07:00 = KST 16:00 (평일).
    - cron: "0 7 * * 1-5"
  workflow_dispatch:      # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 최신 상태로 갱신
        run: git pull --rebase --autostash || true

      - name: 특징주 수집 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/collect.py

      - name: 변경 시 커밋 & 푸시
        id: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain data index.json seen.json)" ]; then
            git add data index.json seen.json
            git commit -m "auto: 특징주 이슈 수집 ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "변경 없음"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: CDN 캐시 퍼지 (jsDelivr)
        if: steps.commit.outputs.pushed == 'true'
        run: |
          REPO="${{ github.repository }}"
          curl -sf "https://purge.jsdelivr.net/gh/${REPO}@main/index.json" > /dev/null || true
          if [ -f changed_codes.txt ]; then
            while IFS= read -r code; do
              [ -z "$code" ] && continue
              curl -sf "https://purge.jsdelivr.net/gh/${REPO}@main/data/${code}.json" > /dev/null || true
            done < changed_codes.txt
          fi
          echo "퍼지 완료"
