name: 전종목 변환표 갱신

on:
  schedule:
    # UTC 22:37 = KST 07:37 (평일 장 시작 전). GitHub cron은 UTC 기준, 정각 혼잡을 피함.
    - cron: "37 22 * * 0-4"
  workflow_dispatch:      # 수동 실행 버튼도 제공

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 변환표 회귀 테스트 (표준 라이브러리만 사용)
        run: python -m unittest discover -v

      - name: 변환표 생성
        run: python scripts/build_tickers.py

      - name: 사명 변경 반영 (옛 사명 → aliases.json)
        run: python scripts/update_aliases.py

      - name: 변경 시 커밋
        id: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain tickers.json aliases.json index.json data)" ]; then
            git add tickers.json aliases.json index.json data
            git commit -m "Update tickers.json / aliases.json ($(date -u +%Y-%m-%d))"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "변경 없음"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: CDN 캐시 퍼지 (jsDelivr)
        if: steps.commit.outputs.pushed == 'true'
        run: |
          REPO="${{ github.repository }}"
          for f in aliases.json index.json; do
            curl -sf "https://purge.jsdelivr.net/gh/${REPO}@main/${f}" > /dev/null || true
          done
          if [ -f changed_codes.txt ]; then
            while IFS= read -r code; do
              [ -z "$code" ] && continue
              curl -sf "https://purge.jsdelivr.net/gh/${REPO}@main/data/${code}.json" > /dev/null || true
            done < changed_codes.txt
          fi
          echo "퍼지 완료"
