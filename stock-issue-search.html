<!--
  종목 이슈 검색 위젯 — Blogger 임베드용 (GitHub + jsDelivr 연결 버전)
  ─────────────────────────────────────────────────────────
  연결 방법:
    1) 아래 USER / REPO 를 본인 GitHub 사용자/레포명으로 교체
    2) DEMO 를 false 로 변경
  데이터 구조:
    index.json      → { "일동제약": "249420", ... }
    data/<코드>.json → { "name": "...", "issues": [{date,text,src}, ...] }
  ※ jsDelivr 정적 서빙은 public 레포에서만 동작합니다.
  ※ 자동 수집으로 자주 갱신할 경우 CDN 캐시 지연이 있으니,
     커밋 후 https://purge.jsdelivr.net/gh/USER/REPO@main/data/<코드>.json 로 퍼지하면 즉시 반영됩니다.
-->
<div id="siw-root" data-theme="light">
  <div class="siw-top">
    <div class="siw-searchbar">
      <input id="siw-input" type="text" placeholder="종목명 검색 (예: 일동제약)" autocomplete="off" spellcheck="false">
      <ul id="siw-suggest" class="siw-suggest"></ul>
    </div>
    <button id="siw-theme" class="siw-theme" type="button" aria-label="테마 전환">
      <span class="siw-theme-icon">◑</span>
    </button>
  </div>
  <div id="siw-result" class="siw-result"></div>
</div>

<style>
  #siw-root{
    --bg:#ffffff; --panel:#f6f7f9; --line:#e6e8ec; --line2:#d3d7dd;
    --text:#1a1d21; --dim:#6b7280; --hover:#eef0f3;
    --up:#d92d20; --down:#1d4ed8; --flat:#1a1d21; --focus:#2563eb;
    --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    background:var(--bg); color:var(--text); font-family:var(--font);
    max-width:760px; margin:0 auto; padding:20px; border:1px solid var(--line);
    border-radius:10px; box-sizing:border-box;
    transition:background .15s, border-color .15s, color .15s;
  }
  #siw-root[data-theme="dark"]{
    --bg:#0e1116; --panel:#161b22; --line:#232a34; --line2:#2d3542;
    --text:#e6edf3; --dim:#8b98a5; --hover:#1f2732;
    --up:#e5484d; --down:#3b82f6; --flat:#c9d1d9; --focus:#3d6ad6;
  }
  #siw-root *{box-sizing:border-box;}
  .siw-top{display:flex; gap:10px; align-items:stretch;}
  .siw-searchbar{position:relative; flex:1;}
  #siw-input{
    width:100%; padding:13px 16px; font-size:16px; font-family:var(--font);
    color:var(--text); background:var(--panel); border:1px solid var(--line2);
    border-radius:8px; outline:none; transition:border-color .15s, background .15s;
  }
  #siw-input:focus{border-color:var(--focus);}
  #siw-input::placeholder{color:var(--dim);}
  .siw-theme{
    flex:0 0 auto; width:48px; border:1px solid var(--line2); border-radius:8px;
    background:var(--panel); color:var(--text); cursor:pointer; font-size:18px;
    transition:background .15s, border-color .15s;
  }
  .siw-theme:hover{background:var(--hover);}
  .siw-suggest{
    list-style:none; margin:4px 0 0; padding:4px; position:absolute; z-index:5;
    left:0; right:0; background:var(--bg); border:1px solid var(--line2);
    border-radius:8px; display:none; max-height:260px; overflow-y:auto;
    box-shadow:0 6px 18px rgba(0,0,0,.08);
  }
  .siw-suggest.on{display:block;}
  .siw-suggest li{
    padding:10px 12px; border-radius:6px; cursor:pointer; font-size:14px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .siw-suggest li:hover,.siw-suggest li.active{background:var(--hover);}
  .siw-suggest li .code{color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums;}
  .siw-result{margin-top:16px;}
  .siw-head{
    display:flex; align-items:baseline; gap:10px; padding-bottom:10px;
    border-bottom:1px solid var(--line2); margin-bottom:2px;
  }
  .siw-head .nm{font-size:20px; font-weight:700;}
  .siw-head .cd{color:var(--dim); font-size:13px; font-variant-numeric:tabular-nums;}
  .siw-head .cnt{margin-left:auto; color:var(--dim); font-size:12px;}
  .siw-row{
    display:grid; grid-template-columns:96px 1fr; gap:14px; align-items:start;
    padding:12px 4px; border-bottom:1px solid var(--line);
  }
  .siw-row .date{color:var(--dim); font-size:13px; font-variant-numeric:tabular-nums; padding-top:1px;}
  .siw-row .txt{font-size:14px; line-height:1.55;}
  .siw-row .txt.up{color:var(--up);}
  .siw-row .txt.down{color:var(--down);}
  .siw-empty{color:var(--dim); font-size:14px; padding:24px 4px; text-align:center;}
</style>

<script>
(function(){
  // ══ 설정 ═══════════════════════════════════════════════════
  const DEMO = true;              // 레포 연결 후 false 로 변경
  const USER = "USER";            // ← 본인 GitHub 사용자명
  const REPO = "REPO";            // ← 레포명
  const BASE = `https://cdn.jsdelivr.net/gh/${USER}/${REPO}@main`;
  const INDEX_URL = `${BASE}/index.json`;
  const DATA_URL  = code => `${BASE}/data/${code}.json`;
  // ══════════════════════════════════════════════════════════

  // 데모용 샘플 (DEMO=true 일 때만 사용)
  const SAMPLE_INDEX = { "일동제약":"249420" };
  const SAMPLE_DATA = {
    "249420": { name:"일동제약", issues:[
      {date:"2026.08.24", text:"中 코로나19 재확산 우려 속 국내 검출률 급증 소식 등에 코로나19 관련주 상승 속 급등", src:"auto"},
      {date:"2026.07.30", text:"2분기 호실적에 상승", src:"auto"},
      {date:"2026.04.14", text:"연구개발 자회사 '유노비아' 흡수합병 결정 등에 강세", src:"auto"},
      {date:"2026.01.07", text:"일동제약그룹, JP모건 헬스케어 컨퍼런스서 신약 파트너링 강화 소식에 급등", src:"manual"},
      {date:"2025.12.24", text:"노보노디스크 경구용 비만치료제 美 FDA 승인 속 경구용 비만치료제 임상 진행 사실 부각에 상승", src:"auto"},
      {date:"2025.09.29", text:"일동그룹, 경구용 비만치료제 임상 1상 톱라인 데이터 공개 소식 등에 급등", src:"manual"},
      {date:"2022.12.28", text:"경구용 코로나19 치료제 '조코바' 국내 긴급사용승인 불발 소식에 급락", src:"auto"},
      {date:"2022.07.21", text:"시오노기제약과 공동개발중인 코로나19 치료제 일본 긴급승인 보류 소식에 하한가", src:"auto"}
    ]}
  };

  async function loadIndex(){
    if(DEMO) return SAMPLE_INDEX;
    const r = await fetch(INDEX_URL); return r.ok ? r.json() : {};
  }
  async function loadStock(code){
    if(DEMO) return SAMPLE_DATA[code] || null;
    const r = await fetch(DATA_URL(code)); return r.ok ? r.json() : null;
  }

  const UP = /(급등|상승|강세|상한가|신고가|흑자|호조|호실적|기대감|부각|순항|입증|성공)/;
  const DOWN = /(급락|하락|약세|하한가|불발|보류|취하|우려|실망|부진|적자|지연|감소)/;
  function tone(t){ if(UP.test(t)) return "up"; if(DOWN.test(t)) return "down"; return ""; }

  const $root = document.getElementById("siw-root");
  const $in = document.getElementById("siw-input");
  const $sug = document.getElementById("siw-suggest");
  const $res = document.getElementById("siw-result");
  const $theme = document.getElementById("siw-theme");
  let INDEX = {}, names = [], active = -1;

  // 인덱스 로드 (검색·자동완성 준비)
  (async ()=>{
    try{ INDEX = await loadIndex(); names = Object.keys(INDEX); }
    catch(e){ INDEX = {}; names = []; }
  })();

  // 테마 (기본 light, 선택은 가능하면 기억)
  try{ const t = localStorage.getItem("siw-theme"); if(t) $root.dataset.theme = t; }catch(e){}
  $theme.addEventListener("click", ()=>{
    const next = $root.dataset.theme === "dark" ? "light" : "dark";
    $root.dataset.theme = next;
    try{ localStorage.setItem("siw-theme", next); }catch(e){}
  });

  function renderSuggest(q){
    const hits = q ? names.filter(n=>n.includes(q)).slice(0,8) : [];
    active = -1;
    if(!hits.length){ $sug.className="siw-suggest"; $sug.innerHTML=""; return; }
    $sug.innerHTML = hits.map(n=>`<li data-name="${n}">${n}<span class="code">${INDEX[n]}</span></li>`).join("");
    $sug.className="siw-suggest on";
    $sug.querySelectorAll("li").forEach(li=>li.onclick=()=>pick(li.dataset.name));
  }

  async function pick(name){
    $in.value = name; $sug.className="siw-suggest"; $sug.innerHTML="";
    const code = INDEX[name];
    $res.innerHTML = `<div class="siw-empty">불러오는 중…</div>`;
    const data = await loadStock(code);
    if(!data){ $res.innerHTML=`<div class="siw-empty">데이터를 찾을 수 없습니다.</div>`; return; }
    const rows = data.issues.map(it=>`
      <div class="siw-row">
        <span class="date">${it.date}</span>
        <span class="txt ${tone(it.text)}">${it.text}</span>
      </div>`).join("");
    $res.innerHTML = `
      <div class="siw-head">
        <span class="nm">${data.name}</span>
        <span class="cd">${code}</span>
        <span class="cnt">이슈 ${data.issues.length}건</span>
      </div>${rows}`;
  }

  $in.addEventListener("input", e=>renderSuggest(e.target.value.trim()));
  $in.addEventListener("keydown", e=>{
    const items = [...$sug.querySelectorAll("li")];
    if(!items.length) return;
    if(e.key==="ArrowDown"){ e.preventDefault(); active=(active+1)%items.length; }
    else if(e.key==="ArrowUp"){ e.preventDefault(); active=(active-1+items.length)%items.length; }
    else if(e.key==="Enter"){ e.preventDefault(); if(active>=0) pick(items[active].dataset.name); else if(items[0]) pick(items[0].dataset.name); return; }
    else return;
    items.forEach((li,i)=>li.classList.toggle("active", i===active));
  });
  document.addEventListener("click", e=>{ if(!e.target.closest("#siw-root")) $sug.className="siw-suggest"; });
})();
</script>
